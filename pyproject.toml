[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echoquality"
version = "2.0.1"
description = "Hierarchical pattern-recognition framework for echocardiographic image quality and adaptive processing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "EchoQuality research project"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "Pillow>=10.0",
  "joblib>=1.3",
  "PyYAML>=6.0",
  "nibabel>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "jupyterlab>=4.0"]
app = ["streamlit>=1.35"]

[project.scripts]
echoquality = "echoquality.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
